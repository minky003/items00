<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숨은 보물 찾기 - 손인식 비전 게임</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">

    <!-- MediaPipe Hands CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            font-family: 'Jua', 'Nanum Gothic', sans-serif;
            background-color: #f0fdf4;
        }

        /* Mirrored Video Preview */
        .mirror-video {
            transform: scaleX(-1);
        }

        @keyframes turtlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .animate-turtle-btn {
            animation: turtlePulse 2s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 md:p-6 text-slate-800">

    <!-- Header Section (Original Style Match) -->
    <header class="w-full max-w-3xl bg-white rounded-3xl shadow-md border-4 border-emerald-300 p-3 md:p-4 mb-3 flex items-center justify-between gap-2 md:gap-4">
        <!-- Level & Score Box -->
        <div class="flex items-center gap-2">
            <div class="bg-amber-100 border-2 border-amber-400 rounded-2xl px-3 py-1.5 md:px-4 md:py-2 flex items-center gap-1">
                <span class="text-sm md:text-lg font-bold text-amber-800">단계:</span>
                <span id="levelVal" class="text-lg md:text-2xl font-black text-amber-600">1</span>
            </div>
            <div class="bg-emerald-100 border-2 border-emerald-400 rounded-2xl px-3 py-1.5 md:px-4 md:py-2 flex items-center gap-1">
                <span class="text-sm md:text-lg font-bold text-emerald-800">점수:</span>
                <span id="scoreVal" class="text-xl md:text-2xl font-black text-emerald-600">0</span>
            </div>
        </div>

        <!-- Target Text Box -->
        <div class="flex-1 text-center bg-amber-50 border-2 border-amber-300 rounded-2xl px-3 py-1.5 md:px-4 md:py-2">
            <span class="text-xs md:text-sm text-amber-700 font-bold block">찾아야 할 목표</span>
            <span id="targetVal" class="text-lg md:text-2xl font-black text-amber-600 truncate">카메라 연결 중...</span>
        </div>

        <!-- Action Buttons (BGM & Restart) -->
        <div class="flex items-center gap-2">
            <button id="bgmBtn" class="bg-amber-400 hover:bg-amber-500 active:scale-95 text-white px-3 py-2 md:px-3.5 md:py-2.5 rounded-2xl shadow font-bold flex items-center gap-1 text-sm md:text-base transition-all">
                <i id="bgmIcon" class="fa-solid fa-music"></i> <span id="bgmText" class="hidden md:inline">BGM</span>
            </button>
            <button id="restartBtn" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white px-3 py-2 md:px-4 md:py-2.5 rounded-2xl shadow font-bold flex items-center gap-1 md:gap-2 transition-all text-sm md:text-base">
                <i class="fa-solid fa-rotate-right"></i> 다시 시작
            </button>
        </div>
    </header>

    <!-- Main Camera Video Feed & Interactive Canvas Area -->
    <main id="gameContainer" class="relative w-full max-w-3xl aspect-[4/3] bg-slate-900 rounded-3xl overflow-hidden shadow-2xl border-4 border-white flex items-center justify-center">
        <!-- Video Feed (Semi-transparent overlay look) -->
        <video id="webcam" class="absolute inset-0 w-full h-full object-cover mirror-video opacity-80" playsinline autoplay muted></video>

        <!-- Canvas for Rendering Items, Hand Cursor, and Hint Effects -->
        <canvas id="gameCanvas" class="absolute inset-0 w-full h-full object-cover z-10"></canvas>

        <!-- Loading & Permission Error Overlay -->
        <div id="loadingOverlay" class="absolute inset-0 bg-slate-900/90 z-20 flex flex-col items-center justify-center text-white p-6 text-center">
            <div id="spinner" class="w-16 h-16 border-4 border-emerald-400 border-t-transparent rounded-full animate-spin mb-4"></div>
            <h2 id="loadingText" class="text-2xl font-bold mb-2">카메라를 연결하는 중입니다...</h2>
            <p id="loadingSubtext" class="text-slate-300 text-sm max-w-sm mb-4">웹캠 사용 권한을 허용해 주세요. 손으로 보물을 짚는 게임입니다!</p>
            <button id="retryCamBtn" class="hidden bg-amber-500 hover:bg-amber-600 text-white font-bold px-6 py-2.5 rounded-2xl shadow-lg transition-all active:scale-95">
                <i class="fa-solid fa-camera mr-2"></i> 카메라 다시 시도
            </button>
        </div>
    </main>

    <!-- Mascot & Hint Interaction Section -->
    <footer class="w-full max-w-3xl mt-3">
        <button id="turtleHintBtn" class="w-full bg-white rounded-3xl shadow-md border-4 border-emerald-300 p-4 flex items-center gap-4 hover:border-amber-400 active:scale-[0.99] transition-all text-left group relative overflow-hidden">
            <!-- Turtle Mascot Container with Hint Badge -->
            <div class="relative shrink-0">
                <div class="w-16 h-16 md:w-20 md:h-20 bg-emerald-100 rounded-2xl border-2 border-emerald-300 flex items-center justify-center text-4xl md:text-5xl animate-turtle-btn shadow-inner">
                    🐢
                </div>
                <span class="absolute -top-2 -right-2 bg-amber-500 text-white text-xs font-black px-2 py-0.5 rounded-full shadow border-2 border-white group-hover:bg-amber-600 transition-colors">
                    💡 힌트!
                </span>
            </div>

            <!-- Speech Bubble Text -->
            <div class="flex-1 bg-emerald-50 border-2 border-emerald-200 rounded-2xl p-3 md:p-4 group-hover:bg-amber-50 group-hover:border-amber-200 transition-colors">
                <p id="turtleMessage" class="text-slate-800 text-base md:text-xl font-bold leading-relaxed">
                    안녕! 나를 누르면 찾아야 할 보물 위치의 힌트를 줄게! 🐢💡
                </p>
            </div>
        </button>
    </footer>

    <!-- Game Logic -->
    <script>
        // Expanded Preset Database of Items
        const ITEM_DATABASE = [
            { name: "사과", emoji: "🍎", size: 60 },
            { name: "바나나", emoji: "🍌", size: 60 },
            { name: "포도", emoji: "🍇", size: 60 },
            { name: "딸기", emoji: "🍓", size: 60 },
            { name: "당근", emoji: "🥕", size: 60 },
            { name: "축구공", emoji: "⚽", size: 55 },
            { name: "보물상자", emoji: "💎", size: 60 },
            { name: "별", emoji: "⭐", size: 60 },
            { name: "아이스크림", emoji: "🍦", size: 60 },
            { name: "선물상자", emoji: "🎁", size: 60 },
            { name: "자동차", emoji: "🚗", size: 60 },
            { name: "우주선", emoji: "🚀", size: 60 },
            { name: "병아리", emoji: "🐥", size: 55 },
            { name: "꽃", emoji: "🌻", size: 60 },
            { name: "수박", emoji: "🍉", size: 60 },
            { name: "피자", emoji: "🍕", size: 60 },
            { name: "버거", emoji: "🍔", size: 60 },
            { name: "도넛", emoji: "🍩", size: 60 },
            { name: "왕관", emoji: "👑", size: 60 },
            { name: "풍선", emoji: "🎈", size: 60 },
            { name: "기차", emoji: "🚂", size: 60 },
            { name: "공룡", emoji: "🦖", size: 60 },
            { name: "고양이", emoji: "🐱", size: 60 },
            { name: "강아지", emoji: "🐶", size: 60 },
            { name: "로봇", emoji: "🤖", size: 60 }
        ];

        // State variables
        let score = 0;
        let currentLevel = 1;
        let currentItemsOnScreen = [];
        let activeTargetNames = [];
        let handPoint = null;
        let dwellTargetId = null;
        let dwellStartTime = 0;
        let audioCtx = null;
        let currentVideoStream = null;
        let wrongEffectItems = {}; // Track wrong item animations { id: timestamp }

        // BGM State
        let bgmPlaying = false;
        let bgmInterval = null;
        let bgmStep = 0;

        // Hint state
        let activeHintTargetId = null;
        let hintTimer = null;

        // Element references
        let videoEl, canvasEl, ctx;

        window.addEventListener('DOMContentLoaded', () => {
            videoEl = document.getElementById('webcam');
            canvasEl = document.getElementById('gameCanvas');
            ctx = canvasEl.getContext('2d');

            window.addEventListener('resize', fitCanvasSize);
            document.getElementById('restartBtn').addEventListener('click', resetGame);
            document.getElementById('turtleHintBtn').addEventListener('click', giveHint);
            document.getElementById('retryCamBtn').addEventListener('click', setupCameraAndHands);
            document.getElementById('bgmBtn').addEventListener('click', toggleBGM);
            document.body.addEventListener('click', initAudioCtx, { once: true });

            fitCanvasSize();
            setupCameraAndHands();
            
            requestAnimationFrame(gameLoop);
        });

        function fitCanvasSize() {
            const rect = canvasEl.parentElement.getBoundingClientRect();
            canvasEl.width = rect.width;
            canvasEl.height = rect.height;
        }

        function initAudioCtx() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Cute Synth BGM System using Web Audio API
        function toggleBGM() {
            initAudioCtx();
            bgmPlaying = !bgmPlaying;
            
            const bgmBtn = document.getElementById('bgmBtn');
            const bgmIcon = document.getElementById('bgmIcon');

            if (bgmPlaying) {
                bgmBtn.classList.remove('bg-amber-400');
                bgmBtn.classList.add('bg-amber-600', 'animate-pulse');
                bgmIcon.className = "fa-solid fa-volume-high";
                startCuteBGM();
            } else {
                bgmBtn.classList.remove('bg-amber-600', 'animate-pulse');
                bgmBtn.classList.add('bg-amber-400');
                bgmIcon.className = "fa-solid fa-music";
                stopCuteBGM();
            }
        }

        function startCuteBGM() {
            if (bgmInterval) clearInterval(bgmInterval);
            
            // Cute pentatonic melody notes (C5, D5, E5, G5, A5, C6)
            const notes = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 783.99, 659.25];
            const bassNotes = [261.63, 329.63, 392.00, 329.63];
            
            bgmStep = 0;
            bgmInterval = setInterval(() => {
                if (!bgmPlaying || !audioCtx) return;
                const now = audioCtx.currentTime;

                // Cute Lead Synth
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                
                const currentNote = notes[bgmStep % notes.length];
                osc.frequency.setValueAtTime(currentNote, now);
                
                gain.gain.setValueAtTime(0.04, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.23);

                // Warm Bass Companion
                if (bgmStep % 2 === 0) {
                    const bassOsc = audioCtx.createOscillator();
                    const bassGain = audioCtx.createGain();
                    bassOsc.type = 'triangle';
                    
                    const bassNote = bassNotes[Math.floor(bgmStep / 2) % bassNotes.length];
                    bassOsc.frequency.setValueAtTime(bassNote, now);
                    
                    bassGain.gain.setValueAtTime(0.05, now);
                    bassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

                    bassOsc.connect(bassGain);
                    bassGain.connect(audioCtx.destination);
                    bassOsc.start(now);
                    bassOsc.stop(now + 0.42);
                }

                bgmStep++;
            }, 260); // Lively tempo
        }

        function stopCuteBGM() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            if (type === 'found') {
                // Extra Cute 'Pop & Pluck' Sound
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc1.type = 'sine';
                osc2.type = 'triangle';

                osc1.frequency.setValueAtTime(600, now);
                osc1.frequency.exponentialRampToValueAtTime(1200, now + 0.12);
                
                osc2.frequency.setValueAtTime(800, now);
                osc2.frequency.exponentialRampToValueAtTime(1600, now + 0.12);

                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(audioCtx.destination);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 0.15);
                osc2.stop(now + 0.15);
            } else if (type === 'wrong') {
                // Cute Funny Wobbly Fail Sound
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(140, now + 0.22);

                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'hint') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.18);
            } else if (type === 'stageComplete') {
                // High Pitch Celebration Chime
                [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(f, now + i * 0.07);
                    gain.gain.setValueAtTime(0.2, now + i * 0.07);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.07 + 0.22);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.07);
                    osc.stop(now + i * 0.07 + 0.22);
                });
            }
        }

        // Camera setup with standard navigator.mediaDevices & MediaPipe Hands
        async function setupCameraAndHands() {
            const overlay = document.getElementById('loadingOverlay');
            const spinner = document.getElementById('spinner');
            const loadingText = document.getElementById('loadingText');
            const loadingSubtext = document.getElementById('loadingSubtext');
            const retryBtn = document.getElementById('retryCamBtn');

            overlay.classList.remove('hidden');
            spinner.classList.remove('hidden');
            retryBtn.classList.add('hidden');
            loadingText.innerText = "카메라 연결 중...";
            loadingSubtext.innerText = "웹캠 권한을 허용해 주세요.";

            if (currentVideoStream) {
                currentVideoStream.getTracks().forEach(track => track.stop());
                currentVideoStream = null;
            }
            if (videoEl.srcObject) {
                const tracks = videoEl.srcObject.getTracks();
                tracks.forEach(track => track.stop());
                videoEl.srcObject = null;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'user',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });

                currentVideoStream = stream;
                videoEl.srcObject = stream;
                await videoEl.play();

                if (typeof Hands === 'undefined') {
                    throw new Error("MediaPipe Hands 스크립트를 불러올 수 없습니다.");
                }

                const hands = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                });

                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                hands.onResults(onHandResults);

                async function processVideoFrame() {
                    if (videoEl && !videoEl.paused && !videoEl.ended && videoEl.readyState >= 2) {
                        try {
                            await hands.send({ image: videoEl });
                        } catch (e) {
                            console.warn("Frame send skipped:", e);
                        }
                    }
                    if (currentVideoStream) {
                        requestAnimationFrame(processVideoFrame);
                    }
                }
                processVideoFrame();

                overlay.classList.add('hidden');
                startNewRound();

            } catch (err) {
                console.error("Camera/MediaPipe initialization error:", err);
                spinner.classList.add('hidden');
                retryBtn.classList.remove('hidden');

                if (err.name === 'NotReadableError' || err.message.includes('Device in use')) {
                    loadingText.innerText = "카메라가 다른 앱에서 사용 중입니다";
                    loadingSubtext.innerText = "Zoom, Teams, 혹은 다른 브라우저 탭에서 카메라를 사용 중인지 확인하고 종료 후 [다시 시도]를 눌러주세요.";
                } else {
                    loadingText.innerText = "카메라 작동 오류";
                    loadingSubtext.innerText = "웹캠에 접근하지 못했습니다. 카메라 권한 설정을 확인하시고 [다시 시도]를 눌러주세요.";
                }
            }
        }

        function onHandResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const indexTip = landmarks[8];

                handPoint = {
                    x: (1.0 - indexTip.x) * canvasEl.width,
                    y: indexTip.y * canvasEl.height
                };
            } else {
                handPoint = null;
            }
        }

        // Spawn items dynamically according to level
        function startNewRound() {
            activeHintTargetId = null;
            wrongEffectItems = {};
            if (hintTimer) clearTimeout(hintTimer);

            // Progressive Difficulty Configuration
            // Level 1: 5 items, 1 target
            // Level 2: 7 items, 2 targets
            // Level 3+: 9~10 items, 3 targets
            const countToSpawn = Math.min(5 + (currentLevel - 1) * 2, 10);
            const targetCount = Math.min(1 + Math.floor((currentLevel - 1) / 1.5), 3);

            const shuffled = [...ITEM_DATABASE].sort(() => Math.random() - 0.5);
            const selected = shuffled.slice(0, countToSpawn);

            currentItemsOnScreen = [];
            const margin = 70;
            const minDist = 85;

            selected.forEach((item, index) => {
                let x, y, valid = false, tries = 0;

                while (!valid && tries < 150) {
                    tries++;
                    x = margin + Math.random() * (canvasEl.width - margin * 2);
                    y = margin + Math.random() * (canvasEl.height - margin * 2);

                    valid = currentItemsOnScreen.every(existing => {
                        return Math.hypot(existing.x - x, existing.y - y) >= minDist;
                    });
                }

                currentItemsOnScreen.push({
                    id: Date.now() + index,
                    name: item.name,
                    emoji: item.emoji,
                    size: item.size,
                    x: x,
                    y: y,
                    found: false,
                    offsetY: Math.random() * Math.PI * 2
                });
            });

            // Select active target names
            activeTargetNames = currentItemsOnScreen.slice(0, targetCount).map(i => i.name);

            updateUI();
            setTurtleMessage(`[단계 ${currentLevel}] 화면 속 보물 중에서 [${activeTargetNames.join(', ')}]을(를) 찾아봐! 🐢`);
        }

        // Turtle Hint Functionality
        function giveHint() {
            initAudioCtx();

            const unfoundTargets = currentItemsOnScreen.filter(item => activeTargetNames.includes(item.name) && !item.found);

            if (unfoundTargets.length === 0) {
                setTurtleMessage("목표 보물을 이미 다 찾았어! 대단해! 🐢✨");
                return;
            }

            const hintItem = unfoundTargets[Math.floor(Math.random() * unfoundTargets.length)];
            activeHintTargetId = hintItem.id;
            playSound('hint');

            setTurtleMessage(`힌트! [${hintItem.emoji} ${hintItem.name}]은(는) 이쪽에 있어! 손으로 짚어봐! 🐢💡`);

            if (hintTimer) clearTimeout(hintTimer);
            hintTimer = setTimeout(() => {
                activeHintTargetId = null;
            }, 4500);
        }

        function updateUI() {
            document.getElementById('scoreVal').innerText = score;
            document.getElementById('levelVal').innerText = currentLevel;

            const unfoundTargets = activeTargetNames.filter(name => {
                const item = currentItemsOnScreen.find(i => i.name === name);
                return item && !item.found;
            });

            if (unfoundTargets.length > 0) {
                document.getElementById('targetVal').innerText = unfoundTargets.join(', ');
            } else {
                document.getElementById('targetVal').innerText = "✨ 모두 발견 완료! ✨";
            }
        }

        function setTurtleMessage(msg) {
            document.getElementById('turtleMessage').innerText = msg;
        }

        function resetGame() {
            score = 0;
            currentLevel = 1;
            startNewRound();
        }

        // Sparkle Particles Effect
        let particleList = [];
        function addSparkles(x, y) {
            for (let i = 0; i < 16; i++) {
                const angle = Math.random() * Math.PI * 2;
                const spd = 2 + Math.random() * 5;
                particleList.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * spd,
                    vy: Math.sin(angle) * spd,
                    radius: 3 + Math.random() * 4,
                    alpha: 1,
                    color: ['#f59e0b', '#10b981', '#ec4899', '#3b82f6', '#8b5cf6'][Math.floor(Math.random() * 5)]
                });
            }
        }

        // Render & Collision Loop
        function gameLoop() {
            ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
            const nowTime = Date.now();
            const now = nowTime * 0.003;

            // 1. Draw Items
            currentItemsOnScreen.forEach(item => {
                let shakeX = 0;
                let isWrongActive = false;

                // Check wrong item animation
                if (wrongEffectItems[item.id]) {
                    const elapsed = nowTime - wrongEffectItems[item.id];
                    if (elapsed < 600) {
                        shakeX = Math.sin(elapsed * 0.05) * 8; // Shake animation
                        isWrongActive = true;
                    } else {
                        delete wrongEffectItems[item.id];
                    }
                }

                if (item.found) {
                    ctx.save();
                    ctx.globalAlpha = 0.3;
                    ctx.font = `${item.size * 0.9}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(item.emoji, item.x, item.y);

                    ctx.globalAlpha = 1.0;
                    ctx.font = 'bold 36px sans-serif';
                    ctx.fillText('✅', item.x, item.y);
                    ctx.restore();
                } else {
                    const floatY = item.y + Math.sin(now + item.offsetY) * 5;
                    const drawX = item.x + shakeX;

                    // Active Hint Effect
                    if (activeHintTargetId === item.id) {
                        ctx.save();
                        const pulseRadius = item.size * 0.8 + Math.sin(nowTime * 0.01) * 10;
                        ctx.beginPath();
                        ctx.arc(drawX, floatY, pulseRadius, 0, Math.PI * 2);
                        ctx.strokeStyle = '#f59e0b';
                        ctx.lineWidth = 4;
                        ctx.setLineDash([8, 8]);
                        ctx.stroke();

                        ctx.font = '32px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('👇', drawX, floatY - item.size * 0.9 - Math.sin(nowTime * 0.01) * 6);
                        ctx.restore();
                    }

                    // Emoji Item Rendering
                    ctx.save();
                    ctx.font = `${item.size}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    ctx.shadowColor = 'rgba(0,0,0,0.4)';
                    ctx.shadowBlur = 8;
                    ctx.shadowOffsetY = 3;

                    ctx.fillText(item.emoji, drawX, floatY);
                    ctx.restore();

                    // Render Wrong Touch Badge (❌)
                    if (isWrongActive) {
                        ctx.save();
                        ctx.font = 'bold 38px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('❌', drawX, floatY);
                        ctx.restore();
                    }
                }
            });

            // 2. Hand Cursor & Touch Collision Logic
            if (handPoint) {
                // Fingertip Cursor Glow
                ctx.save();
                ctx.beginPath();
                ctx.arc(handPoint.x, handPoint.y, 18, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(245, 158, 11, 0.6)';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                ctx.font = '22px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('👆', handPoint.x, handPoint.y - 28);
                ctx.restore();

                // Check collision
                let touchingItem = null;
                currentItemsOnScreen.forEach(item => {
                    if (item.found) return;
                    const dist = Math.hypot(item.x - handPoint.x, item.y - handPoint.y);
                    if (dist < item.size * 0.75) {
                        touchingItem = item;
                    }
                });

                if (touchingItem) {
                    if (dwellTargetId !== touchingItem.id) {
                        dwellTargetId = touchingItem.id;
                        dwellStartTime = Date.now();
                    } else {
                        if (Date.now() - dwellStartTime > 180) { // 180ms dwell
                            const isCorrectTarget = activeTargetNames.includes(touchingItem.name);

                            if (isCorrectTarget) {
                                // Correct Object Selected!
                                touchingItem.found = true;
                                dwellTargetId = null;

                                if (activeHintTargetId === touchingItem.id) {
                                    activeHintTargetId = null;
                                }

                                score += 100;
                                playSound('found');
                                addSparkles(touchingItem.x, touchingItem.y);
                                setTurtleMessage(`우와! ${touchingItem.emoji} ${touchingItem.name}을(를) 찾았어! 정답이야! 🎉`);

                                updateUI();

                                // Check if all current level targets found
                                const allTargetsFound = activeTargetNames.every(name => {
                                    const targetItem = currentItemsOnScreen.find(i => i.name === name);
                                    return targetItem && targetItem.found;
                                });

                                if (allTargetsFound) {
                                    playSound('stageComplete');
                                    currentLevel++;
                                    setTurtleMessage(`🎉 대단해! 목표를 모두 찾았어! 다음 [단계 ${currentLevel}]로 넘어가자! 🚀`);
                                    setTimeout(() => {
                                        startNewRound();
                                    }, 1800);
                                }
                            } else {
                                // Incorrect Object Selected (Wrong Choice!)
                                if (!wrongEffectItems[touchingItem.id]) {
                                    wrongEffectItems[touchingItem.id] = Date.now();
                                    playSound('wrong');
                                    setTurtleMessage(`아니야! ${touchingItem.emoji} ${touchingItem.name}은(는) 찾는 보물이 아니야! 🐢❌`);
                                }
                                dwellTargetId = null; // Reset dwell to prevent constant spamming
                            }
                        }
                    }
                } else {
                    dwellTargetId = null;
                }
            }

            // 3. Render Sparkle Particles
            particleList.forEach((p, idx) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.restore();

                if (p.alpha <= 0) particleList.splice(idx, 1);
            });

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
